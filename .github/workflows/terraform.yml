name: Terraform CI/CD

on:
  # ============================================================
  # Feature branch push
  # Local → virtual-network-vnet1 → CI
  # ============================================================
  push:
    branches:
      - virtual-network-vnet1
      - main

  # ============================================================
  # Manual workflow trigger
  # ============================================================
  workflow_dispatch:


# ==============================================================
# Default permissions
# ==============================================================
permissions:
  contents: read


jobs:

  # ============================================================
  # CI - Terraform Format, Validate, Lint, Security & Plan
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    defaults:
      run:
        working-directory: ./prod/parent module

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Setup Terraform
      # ========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ========================================================
      # Terraform Format Check
      # ========================================================
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # ========================================================
      # TFLint
      # ========================================================
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5


      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # ========================================================
      # Gitleaks - Secret Detection
      # ========================================================
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # Checkov - Terraform Security Scan
      # ========================================================
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./prod/parent module
          framework: terraform
          quiet: false
          soft_fail: false


      # ========================================================
      # Azure Login - OIDC
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ========================================================
      # Terraform Init
      # ========================================================
      - name: Terraform Init
        run: terraform init -input=false -lock-timeout=5m


      # ========================================================
      # Terraform Validate
      # ========================================================
      - name: Terraform Validate
        run: terraform validate


      # ========================================================
      # Terraform Plan
      # ========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan


      # ========================================================
      # Convert Plan to Text
      # ========================================================
      - name: Convert Plan to Text
        run: terraform show -no-color tfplan > tfplan.txt


      # ========================================================
      # Upload Terraform Plan
      # ========================================================
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            prod/parent module/tfplan
            prod/parent module/tfplan.txt
          if-no-files-found: error
          retention-days: 3


  # ============================================================
  # CD - Terraform Apply
  # ============================================================
  terraform-cd:
    name: Terraform CD
    runs-on: ubuntu-latest

    needs:
      - terraform-ci

    # ==========================================================
    # CD ONLY runs after push to main
    # ==========================================================
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'


    # ==========================================================
    # Production Environment
    # ==========================================================
    environment:
      name: production


    # ==========================================================
    # Prevent multiple production applies
    # ==========================================================
    concurrency:
      group: terraform-production
      cancel-in-progress: false


    permissions:
      contents: read
      actions: read
      id-token: write


    defaults:
      run:
        working-directory: ./prod/parent module

    steps:

      # ========================================================
      # Checkout
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Setup Terraform
      # ========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ========================================================
      # Azure Login - OIDC
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ========================================================
      # Terraform Init
      # ========================================================
      - name: Terraform Init
        run: terraform init -input=false -lock-timeout=5m


      # ========================================================
      # Download EXACT plan generated by CI
      # ========================================================
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/terraform-plan


      # ========================================================
      # Verify Plan Files
      # ========================================================
      - name: Verify Terraform Plan Files
        run: |
          echo "Checking Terraform plan files..."

          test -f "$GITHUB_WORKSPACE/terraform-plan/tfplan"
          test -f "$GITHUB_WORKSPACE/terraform-plan/tfplan.txt"

          echo "Terraform plan files verified successfully."


      # ========================================================
      # Display Terraform Plan
      # ========================================================
      - name: Display Terraform Plan
        run: |
          echo "=========================================="
          echo "        TERRAFORM CD PLAN"
          echo "=========================================="

          cat "$GITHUB_WORKSPACE/terraform-plan/tfplan.txt"


      # ========================================================
      # Terraform Apply
      # ========================================================
      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            "$GITHUB_WORKSPACE/terraform-plan/tfplan"


      # ========================================================
      # Upload Applied Plan
      # ========================================================
      - name: Upload Terraform CD Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-cd-plan
          path: ${{ github.workspace }}/terraform-plan/tfplan.txt
          retention-days: 3