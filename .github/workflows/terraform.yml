name: Terraform CI/CD

on:
  push:
    branches:
      - virtual-network-vnet1

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

jobs:

  # ============================================================
  # CI - Format, Validate & Terraform Plan
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./prod/parent module

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Convert Plan to Text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            prod/parent module/tfplan
            prod/parent module/tfplan.txt
          retention-days: 1


  # ============================================================
  # CD - Plan Review / Output Only
  # ============================================================
  terraform-cd:
    name: Terraform CD
    runs-on: ubuntu-latest

    needs:
      - terraform-ci

    if: github.event_name == 'push'

    steps:

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform-plan

      - name: Display Terraform Plan
        run: |
          echo "=========================================="
          echo "        TERRAFORM CD PLAN"
          echo "=========================================="
          cat "terraform-plan/tfplan.txt"

      - name: Upload Plan for CD
        uses: actions/upload-artifact@v4
        with:
          name: terraform-cd-plan
          path: terraform-plan/prod/parent module/tfplan.txt
          retention-days: 1